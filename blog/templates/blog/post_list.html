{% extends 'blog/base.html' %}
{% block content %}
<div class="container">
    <div class="row text-center">
        {% for post in posts %}
            <div class="col-3">
                <div class="card mb-4 box-shadow">
                    <div class="card-header">
                            <div class="card-body">
                                <h3 class="card-title pricing-card-title">{{ post.title }}</h3>
                                <p>{{ post.content|truncatechars:100 }}</p>
                                <li class="list-group-item">
                                    <a href="{% url 'blog:post_detail' post.pk %}" class="btn btn-primary">Подробнее</a>
                                    <a href="{% url 'blog:post_update' post.pk %}" class="btn btn-secondary">Редактировать</a>
                                    <a href="{% url 'blog:post_delete' post.pk%}" class="btn btn-danger">Удалить</a>
                                </li>
                            </div>
                    </div>
                </div>
          </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
