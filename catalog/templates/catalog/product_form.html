{% extends 'catalog/base.html' %}
{% block content %}
<div class="container mt-3">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a href="{% url 'catalog:home' %}">Отмена</a>
    </form>
</div>
{% endblock %}
